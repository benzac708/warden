name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit and property tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  scan:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner on source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  build:
    needs: [test, scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:v1

  scan-image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Run Trivy vulnerability scanner on the arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  bump-image-tag:
    needs: [build, scan-image]
    runs-on: ubuntu-latest
    steps:
      - name: Trust GitHub's pinned ED25519 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          EXPECTED='SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "GitHub host key mismatch: $ACTUAL" >&2
            exit 1
          fi
      - name: Bump image tag in config repo
        env:
          SSH_KEY: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          git clone git@github.com:benzac708/warden-config.git /tmp/warden-config
          cd /tmp/warden-config/base
          OLD=$(grep 'image: ghcr.io/benzac708/warden:' deployment.yaml)
          sed -i 's|image: ghcr.io/benzac708/warden:.*|image: ghcr.io/benzac708/warden:${{ github.sha }}|' deployment.yaml
          NEW=$(grep 'image: ghcr.io/benzac708/warden:' deployment.yaml)
          if [ "$OLD" = "$NEW" ]; then
            echo "image tag did not change; refusing an empty commit" >&2
            exit 1
          fi
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "chore: bump warden to ${{ github.sha }}"
          git push origin main
